<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galo Zé — Gestão de Pessoas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa com a marca + área de trabalho; no celular a barra vira faixa rolável no topo */
:root{
  --amber:#E8A000;--amber-ink:#5a3a00;--wine:#8B1010;--ok:#2f7a4a;
  --bg:#f6f3ef;--card:#ffffff;--ink:#2b2522;--muted:#75695f;--line:#e6ded4;--soft:#f1ebe3;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--amber:#F2B53A;--amber-ink:#2a1c00;--wine:#e07a6e;--ok:#6cc08d;--bg:#1b1816;--card:#25211e;--ink:#efe8e1;--muted:#a99d92;--line:#3a3430;--soft:#2e2925;color-scheme:dark}}
:root[data-theme="dark"]{--amber:#F2B53A;--amber-ink:#2a1c00;--wine:#e07a6e;--ok:#6cc08d;--bg:#1b1816;--card:#25211e;--ink:#efe8e1;--muted:#a99d92;--line:#3a3430;--soft:#2e2925;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;min-height:100vh}
nav{width:220px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.lg{width:100%;max-width:140px;display:block;margin:0 auto 12px}
nav button{all:unset;display:block;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--amber);color:var(--amber-ink);font-weight:600}
nav button:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.who{margin-top:12px;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.who b{display:block;color:var(--ink);font-size:13px}
main{flex:1;padding-block:22px;padding-inline:22px;min-width:0;max-width:1200px}
h1{margin:0 0 2px;font:700 24px/1.2 var(--f-display);color:var(--wine);text-wrap:balance}
h2{font:600 16px/1.3 var(--f-display);margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.grid .card{margin:0}
.k{font:700 28px/1.1 var(--f-display);color:var(--amber);font-variant-numeric:tabular-nums}.k.r{color:var(--wine)}
.kl{font-size:13px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.bar span{width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:10px;background:var(--amber);border-radius:5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.s{background:var(--wine);color:#fff}.btn.g{background:none;color:var(--wine);padding:4px 8px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
label .req{color:var(--wine)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:12px}
input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--wine)}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.top input{margin:0;flex:1;min-width:160px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--wine)}
.al{padding:9px 0;border-bottom:1px solid var(--line)}.al:last-child{border:0}
.tl{border-left:3px solid var(--amber);padding-left:14px;margin-left:6px;display:grid;gap:12px}.tl small{color:var(--muted)}
#md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#md>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.fc{cursor:pointer;text-align:left;width:100%;font:inherit}.fc:hover{border-color:var(--amber)}
.link{all:unset;color:var(--wine);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.err{color:var(--wine);font-size:13px;margin:-6px 0 10px}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.note b{color:var(--wine)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw}
.acc td{text-align:center}.acc td:first-child,.acc th:first-child{text-align:left}
@media(max-width:720px){body{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;align-items:center}.lg{width:42px;margin:0 8px 0 0}nav button{white-space:nowrap}.who{display:none}main{padding-inline:16px;padding-block:16px}}

body.login nav{display:none}
body.login main{display:flex;justify-content:center;max-width:none}
.lbox{width:100%;max-width:380px;text-align:center;padding-top:6vh}.lbox .lg{max-width:120px}.lbox form{text-align:left;margin-top:14px}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
.ck{display:flex;align-items:center;gap:6px;color:var(--ink);margin:0;font-size:14px;cursor:pointer}
.pr{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.pr:last-child{border:0}
.pa{display:flex;gap:6px;flex-wrap:wrap}
.dl{margin-bottom:12px}.dl small{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em}

.fcard{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.fcard .open{all:unset;cursor:pointer;display:block;width:100%}.fcard .open:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.btn.sm{padding:2px 0;font-size:13px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px}.info small{display:block;color:var(--muted);font-size:12px}
.acts{white-space:nowrap}
.frow{display:grid;grid-template-columns:minmax(140px,240px) minmax(60px,1fr) 44px 110px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.frow:last-of-type{border:0}
.trk{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.trk i{display:block;height:100%;background:var(--amber);border-radius:5px}
.frow b{font-variant-numeric:tabular-nums;text-align:right}.frow .tag{justify-self:start}
details{margin-top:10px}summary{cursor:pointer;color:var(--wine);font-weight:600}
.its{margin:8px 0;padding-left:18px;display:grid;gap:4px}
.dgi{display:block;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
#md>div.wide{max-width:640px}
.top select{width:auto;margin:0}
@media(max-width:720px){.frow{grid-template-columns:1fr 44px}.frow .trk{grid-column:1/-1;grid-row:2}.g2{grid-template-columns:1fr}}
</style>

function calcDiag(rows){
 const H=(rows[0]||[]).map(h=>String(h??'').trim()),D=rows.slice(1).filter(r=>r&&r.some(c=>c!==''&&c!=null));
 const res={n:D.length,fatores:{},itens:{},achados:[],faltando:[],motivacao:null};
 for(const[key,ins]of Object.entries(INSTR)){
  const s=H.findIndex(h=>ins.re.test(norm(h)));
  if(s<0||s+ins.len>H.length){res.faltando.push(ins.n);continue}
  const vals=i=>D.map(r=>Number(r[s+i-1])).filter(v=>v>=1&&v<=5);
  res.itens[key]=faixa(1,ins.len).map(i=>({t:H[s+i-1],m:r2(media(vals(i)))}));
  res.fatores[key]={};ins.fat.forEach(([fk,,its])=>{res.fatores[key][fk]=r2(media(its.flatMap(vals)))});
  res.achados.push(key)}
 const mi=H.findIndex(h=>/nivel de motivacao/.test(norm(h)));
 if(mi>=0){const mv=D.map(r=>r[mi]).filter(c=>c!==''&&c!=null).map(Number).filter(v=>!isNaN(v));res.motivacao=r2(media(mv))}
 return res}

/* ---------- Dados ---------- */
let raf=0;function agendar(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if($('#md').hidden)render()})}
function setPart(k,key,arr){(L[k]=L[k]||{})[key]=arr;const m=new Map();Object.values(L[k]).forEach(a=>a.forEach(x=>m.set(x.id,x)));S[k]=[...m.values()];agendar()}
function sub(k,ref,key){DUNSUB.push(onSnapshot(ref,s=>setPart(k,key,s.docs?s.docs.map(d=>({...d.data(),id:d.id})):(s.exists()?[{...s.data(),id:s.id}]:[])),e=>console.warn(k,key,e.code)))}
function assinarDados(){DUNSUB.forEach(u=>{try{u()}catch(e){}});DUNSUB=[];L={};KS.forEach(k=>S[k]=[]);
 if(EDIT){KS.forEach(k=>sub(k,collection(db,k),'all'));return}
 const a=ACC[MYID]||{},secs=a.secs||[],frs=a.frs||[],todas=!!a.todas;
 if(!secs.length||(!todas&&!frs.length))return;
 if(todas)sub('fr',collection(db,'fr'),'all');else frs.forEach(f=>sub('fr',doc(db,'fr',f),f));
 ['fu','de','acoes','diag'].filter(k=>secs.includes(k)).forEach(k=>{
  const ex=k=='diag'?[where('visivel','==',true)]:[];
  if(todas)sub(k,ex.length?query(collection(db,k),...ex):collection(db,k),'all');
  else frs.forEach(f=>sub(k,query(collection(db,k),where('fr','==',f),...ex),f))})}
function pararTudo(){[...UNSUB,...DUNSUB].forEach(u=>{try{u()}catch(e){}});UNSUB=[];DUNSUB=[];L={};KS.forEach(k=>S[k]=[]);ACC={}}
onAuthStateChanged(auth,async u=>{
 pararTudo();LOADED=false;
 if(!u){MYID=null;EDIT=false;telaLogin();return}
 document.body.classList.remove('login');
 MYID=u.uid;MYEMAIL=u.email||'';$('#mn').innerHTML='<div class="card">Carregando…</div>';
 try{const a=await getDoc(doc(db,'admins',u.uid));EDIT=a.exists();if(EDIT){MYPAPEL=a.data().papel||'';MYNOME=a.data().nome||''}}catch(e){EDIT=false}
 if(EDIT){UNSUB.push(onSnapshot(collection(db,'acessos'),s=>{ACC={};s.docs.forEach(d=>ACC[d.id]=d.data());if($('#md').hidden&&cur!='acc')render()}));assinarDados();LOADED=true;render()}
 else{let prev=null;
  UNSUB.push(onSnapshot(doc(db,'acessos',u.uid),d=>{ACC={};if(d.exists())ACC[u.uid]=d.data();MYNOME=(ACC[u.uid]||{}).nome||'';
   const a=ACC[u.uid]||{},k=JSON.stringify([a.secs,a.frs,a.todas]);if(k!==prev){prev=k;assinarDados()}LOADED=true;render()},()=>{LOADED=true;render()}))}});

/* Franquias */

 return `<h1>Franquias</h1><div class="sub">${S.fr.length} unidade(s)</div><div class="top"><input id="q" placeholder="Pesquisar franquia…" value="${esc(q)}">${addBtn('fr','+ Adicionar franquia')}</div>
 <div class="grid">${r.map(f=>`<div class="card fcard"><button class="open" data-a="frp" data-x="${esc(f.id)}"><b>${esc(f.nome)}</b><div class="kl">${esc([f.codigo,f.cidade].filter(Boolean).join(' · ')||'sem código')}${can('fu')?' · '+S.fu.filter(u=>u.fr==f.id&&u.status!='Inativo').length+' ativo(s)':''}</div></button>${EDIT?`<button class="btn g sm" data-a="edit" data-x="fr" data-y="${esc(f.id)}">Editar dados</button>`:''}</div>`).join('')||vazio('Nenhuma franquia encontrada.')}</div>`}
function frH(){const f=S.fr.find(x=>x.id==fv);if(!f){fv=null;return frList()}
 const em=S.fu.filter(u=>u.fr==fv),dm=S.de.filter(d=>d.fr==fv),ac=S.acoes.filter(a=>a.fr==fv),dg=S.diag.filter(g=>g.fr==fv);
 const info=[['Código',f.codigo],['CNPJ',f.cnpj],['Endereço',f.end],['Cidade',f.cidade],['Telefone',f.tel],['Responsável',f.resp],['E-mail do responsável',f.emailResp]].filter(x=>x[1]);

 ${can('diag')?`<div class="card"><h2>Diagnósticos</h2>${dg.length?dg.map(diagItem).join(''):vazio()}</div>`:''}`}

/* Funcionário */
function profH(){const id=pf,u=S.fu.find(x=>x.id==id);if(!u){pf=null;return frList()}
 const acs=S.acoes.filter(a=>a.fu==id||(Array.isArray(a.participantes)&&a.participantes.includes(id))||(Array.isArray(a.contratados)&&a.contratados.includes(id)));
 const ev=[];
 if(u.adm)ev.push([u.adm,'Admissão']);if(u.deslig)ev.push([u.deslig,'Desligamento'+(u.motivoDeslig?' — '+esc(u.motivoDeslig):'')]);

 S.at.filter(x=>x.fu==id).forEach(x=>ev.push([x.data,`Atestado — ${esc(x.dias||'?')} dia(s)`]));

 ${can('acoes')?`<div class="card tw"><h2>Ações de RH</h2>${acoesTbl(acs)}</div>`:''}

/* Painel */

 const od=S.de.filter(d=>d.prazo&&d.prazo<t&&d.status!='Concluída'),op=S.de.filter(d=>d.status!='Concluída'),pend=S.ac.filter(a=>a.status=='Pendente');

 if(EDIT&&!SUP())S.ac.filter(a=>a.supStatus=='Revisado com observações'&&a.registradoPor==MYID&&!(a.editadoEm>a.supEm)).forEach(a=>al.push(`A supervisora deixou observações no registro de <b>${quem(a,false)}</b> (${fd(a.data)})`));
 if(EDIT)pend.filter(a=>a.prox&&a.prox<=soon).forEach(a=>al.push(`Acompanhamento de <b>${quem(a,false)}</b> em ${fd(a.prox)}`));
 const nNovos=S.cand.filter(c=>(c.etapa||'Novo')=='Novo').length;if(EDIT&&nNovos)al.push(`<b>${nNovos}</b> candidato(s) novo(s) para triagem`);

 const K=(l,v,r)=>`<div class="card"><div class="k ${r?'r':''}">${v}</div><div class="kl">${l}</div></div>`;

 <div class="card"><h2>Alertas</h2>${al.length?al.map(a=>`<div class="al">${a}</div>`).join(''):vazio('Nenhum alerta no momento.')}</div>

 <form class="card" id="nf"><h2>Criar login de visualização</h2>
  <div class="g2"><div><label for="n_nome">Nome <span class="req">*</span></label><input id="n_nome" required></div><div><label for="n_email">E-mail <span class="req">*</span></label><input id="n_email" type="email" required></div></div>
  <label for="n_senha">Senha provisória (mínimo 6 caracteres) <span class="req">*</span></label><input id="n_senha" type="text" minlength="6" required autocomplete="off">
  <label>Áreas liberadas</label><div class="cks">${chkA('n',['dash','fr','fu','acoes','de'])}</div>
  <label>Franquias</label><div class="cks">${chkF('n',[],false)}</div>
  <div id="nerr" class="err" hidden></div><button class="btn s" type="submit" id="nbtn">Criar login</button></form>
 <div class="card"><h2>Pessoas com acesso</h2>${ids.length?ids.map(id=>{const a=ACC[id];return `<div class="pr" data-id="${esc(id)}"><div><b>${esc(a.nome||'Sem nome')}</b><br><small class="kl">${esc(a.email||'')}</small></div><div><small class="kl">Áreas</small><div class="cks">${chkA('p_'+esc(id),a.secs||[])}</div></div><div><small class="kl">Franquias</small><div class="cks">${chkF('p_'+esc(id),a.frs||[],a.todas)}</div></div>
  <div class="pa"><button class="btn" data-a="saveAcc" data-x="${esc(id)}">Salvar</button><button class="btn g" data-a="resetP" data-x="${esc(id)}">Enviar nova senha</button><button class="btn g" data-a="rmAcc" data-x="${esc(id)}">Remover acesso</button></div></div>`}).join(''):vazio('Nenhum login de visualização criado ainda.')}</div>`}
let secApp=null;
async function criarLogin(){const er=$('#nerr'),b=$('#nbtn');er.hidden=true;
 const nome=$('#n_nome').value.trim(),email=$('#n_email').value.trim().toLowerCase(),senha=$('#n_senha').value,a=lerAcc($('#nf'));
 if(!nome||!email||senha.length<6){er.textContent='Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.';er.hidden=false;return}
 if(!a.todas&&!a.frs.length){er.textContent='Marque ao menos uma franquia (ou "Todas as franquias").';er.hidden=false;return}
 b.disabled=true;b.textContent='Criando…';
 try{secApp=secApp||initializeApp(firebaseConfig,'criador');const sa=getAuth(secApp);
  const cred=await createUserWithEmailAndPassword(sa,email,senha);await signOut(sa);
  await setDoc(doc(db,'acessos',cred.user.uid),{nome,email,...a});
  toast(`Login criado para ${nome}. Passe o e-mail e a senha provisória para a pessoa.`);render()}
 catch(e){b.disabled=false;b.textContent='Criar login';er.textContent=e.code=='auth/email-already-in-use'?'Já existe um login com este e-mail.':e.code=='auth/invalid-email'?'E-mail inválido.':e.code=='auth/weak-password'?'Senha fraca: use pelo menos 6 caracteres.':'Não foi possível criar o login ('+(e.code||'erro')+').';er.hidden=false}}

/* ---------- Formulários ---------- */
function opts(t,ctx){
 if(Array.isArray(t))return t.map(x=>Array.isArray(x)?x:[x,x]);
 if(t=='@fr')return S.fr.map(x=>[x.id,x.nome]);
 if(t=='@fu'){const l=ctx&&ctx.fr?S.fu.filter(u=>u.fr==ctx.fr):S.fu;return l.map(x=>[x.id,x.nome+(x.status=='Inativo'?' (desligado)':'')])}
 return []}
function campo(f,r,ctx){const[n,l,t,req,flag]=f,v=r[n]??'',fid='f_'+n,sg=flag=='sig'?' <span class="tag">sigiloso</span>':'',lab=`<label for="${fid}">${esc(l)}${req?' <span class="req">*</span>':''}${sg}</label>`;
 if(t=='multi'){const sel=Array.isArray(v)?v:[],l2=ctx&&ctx.fr?S.fu.filter(u=>u.fr==ctx.fr&&(u.status!='Inativo'||sel.includes(u.id))):[];
  return `<label>${esc(l)}</label><div class="cks multi" data-n="${n}">${!ctx||!ctx.fr?'<span class="kl">Escolha a franquia para ver os funcionários.</span>':l2.length?l2.map(u=>`<label class="ck"><input type="checkbox" name="${n}" value="${esc(u.id)}" ${sel.includes(u.id)?'checked':''}> ${esc(u.nome)}</label>`).join(''):'<span class="kl">Nenhum funcionário ativo nesta franquia.</span>'}</div>`}
 if(Array.isArray(t)||(typeof t=='string'&&t[0]=='@'))return lab+`<select id="${fid}" name="${n}"><option value="">—</option>${opts(t,ctx).map(x=>`<option value="${esc(x[0])}" ${x[0]==v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
 if(t=='text')return lab+`<textarea id="${fid}" name="${n}" rows="3">${esc(v)}</textarea>`;
 return lab+`<input id="${fid}" name="${n}" type="${t||'text'}" value="${esc(v)}">`}
function lerForm(fm){const d={};fm.querySelectorAll('.multi').forEach(m=>d[m.dataset.n]=[]);
 for(const[n,v]of new FormData(fm)){if(Array.isArray(d[n]))d[n].push(String(v));else d[n]=String(v).trim()}return d}
const camposDe=(k,r)=>k=='acoes'?[...BASE_TOP,...((TIPOS[r.tipo]||{}).f||[]),...BASE_BOT]:E[k].f.filter(f=>f[4]!='nf');
function abrirForm(k,id,pre){const base=id?(S[k].find(x=>x.id==id)||{}):(pre||{});const r={...base};
 if(k=='acoes'){if(id)Object.assign(r,S.acoes_sig.find(x=>x.id==id)||{});if(!id){r.status=r.status||'Planejada';r.data=r.data||hoje()}}
 if(!id&&r.fu&&!r.fr)r.fr=(S.fu.find(u=>u.id==r.fu)||{}).fr||'';
 if(!id&&k!='acoes'&&E[k].f.some(f=>f[0]=='data')&&!r.data)r.data=hoje();
 FORM={k,id:id||'',r};desenharForm()}
function desenharForm(){const{k,id,r}=FORM,fs=camposDe(k,r),ctx={fr:r.fr};
 const tit=k=='acoes'?(id?'Editar ação de RH':'Nova ação de RH'):(id?'Editar ':'Novo(a) ')+E[k].s;
 const baixa=k=='acoes'&&r.tipo=='dl'?`<label class="ck" style="margin-bottom:12px"><input type="checkbox" id="f_baixa" ${id?'':'checked'}> Registrar o desligamento na ficha do funcionário</label>`:'';
 $('#md').innerHTML=`<div role="dialog" aria-modal="true"><h2>${tit}</h2><form id="fm">${fs.map(f=>campo(f,r,ctx)).join('')}${baixa}<div id="ferr" class="err" hidden></div><div style="display:flex;gap:8px"><button class="btn" type="submit" id="fsv">Salvar</button><button class="btn g" type="button" data-a="cl">Cancelar</button></div></form></div>`;
 $('#md').hidden=false;const fm=$('#fm');
 fm.addEventListener('submit',ev=>{ev.preventDefault();salvar()});
 fm.addEventListener('change',ev=>{const n=ev.target.name;if((n=='fr'||n=='tipo')&&(k=='acoes'||fs.some(f=>f[2]=='@fu'||f[2]=='multi'))){Object.assign(FORM.r,lerForm(fm));desenharForm();const el=$('#f_'+n);el&&el.focus()}})}
async function salvar(){const{k,id}=FORM,fm=$('#fm'),d=lerForm(fm),fs=camposDe(k,{...FORM.r,...d}),er=$('#ferr');
 const falta=fs.filter(f=>f[3]&&(Array.isArray(d[f[0]])?!d[f[0]].length:!d[f[0]])).map(f=>f[1]);
 if(k=='ac'&&!d.fu&&!(d.participantes||[]).length&&!d.pessoa)falta.push('quem foi atendido (funcionário, participantes ou pessoa)');
 if(falta.length){er.textContent='Preencha: '+falta.join(', ')+'.';er.hidden=false;return}
 const baixa=$('#f_baixa')?.checked,btn=$('#fsv');btn.disabled=true;btn.textContent='Salvando…';
 try{const old=id?S[k].find(x=>x.id==id):null,ref=id?doc(db,k,id):doc(collection(db,k));
  if(k=='acoes'){const pub={criado:old?.criado||hoje()},sg={};let temSig=false;
   fs.forEach(f=>{const n=f[0],v=d[n]??(f[2]=='multi'?[]:'');if(f[4]=='sig'){sg[n]=v;temSig=true}else pub[n]=v});
   if(old&&Array.isArray(old.contratados)&&!fs.some(f=>f[0]=='contratados'))delete pub.contratados;
   await setDoc(ref,pub);
   if(temSig)await setDoc(doc(db,'acoes_sig',ref.id),sg);else if(id)await deleteDoc(doc(db,'acoes_sig',id)).catch(()=>{});
   if(pub.tipo=='dl'&&baixa&&pub.fu){const u=S.fu.find(x=>x.id==pub.fu);if(u){const o={...u,status:'Inativo',deslig:pub.dataSaida,motivoDeslig:pub.motivo};delete o.id;await setDoc(doc(db,'fu',u.id),o)}}}
  else{const o=old?{...old,...d}:{...d,criado:hoje()};delete o.id;
   if(k=='ac'){if(!old)Object.assign(o,{registradoPor:MYID,registradoNome:MYNOME||MYEMAIL,registradoPapel:MYPAPEL,registradoEm:agora()});else Object.assign(o,{editadoPor:MYID,editadoNome:MYNOME||MYEMAIL,editadoEm:agora()})}
   await setDoc(ref,o)}
  fechar();toast('Salvo.')}
 catch(err){btn.disabled=false;btn.textContent='Salvar';er.textContent=err&&err.code=='permission-denied'?'Você não tem permissão para salvar aqui.':'Não foi possível salvar. Verifique a conexão e tente de novo.';er.hidden=false}}
const fechar=()=>{$('#md').hidden=true;$('#md').innerHTML='';FORM=null;agendar()};
function confirmar(titulo,texto,acao,x,y){$('#md').innerHTML=`<div role="dialog" aria-modal="true"><h2>${titulo}</h2><p>${texto}</p><div style="display:flex;gap:8px"><button class="btn s" data-a="${acao}" data-x="${esc(x)}" data-y="${esc(y||'')}">Confirmar</button><button class="btn g" data-a="cl">Cancelar</button></div></div>`;$('#md').hidden=false}
function pedirExclusao(k,id){
 if(k=='fr'){const n=S.fu.filter(u=>u.fr==id).length+S.acoes.filter(a=>a.fr==id).length+S.de.filter(d=>d.fr==id).length+S.diag.filter(g=>g.fr==id).length;if(n){toast(`Esta franquia tem ${n} registro(s) ligados (funcionários, ações, demandas ou diagnósticos). Exclua-os ou marque a franquia como Inativa.`);return}}
 if(k=='fu'){const n=['at','ac','de'].reduce((s,c)=>s+S[c].filter(x=>x.fu==id).length,0)+S.acoes.filter(a=>a.fu==id||(a.participantes||[]).includes(id)).length;if(n){toast(`Este funcionário tem ${n} registro(s) ligados. Marque-o como Inativo em vez de excluir.`);return}}
 if(k=='ac'&&!SUP()){toast('Somente a supervisora pode excluir acompanhamentos.');return}
 const r=S[k].find(x=>x.id==id)||{};
 confirmar('Excluir registro?',`<b>${esc(r.nome||r.titulo||(k=='acoes'?acTit(r):'')||nm('fu',r.fu))}</b> será removido(a) para todos. Não dá para desfazer.`,'delok',k,id)}
async function excluir(k,id){try{await deleteDoc(doc(db,k,id));if(k=='acoes')await deleteDoc(doc(db,'acoes_sig',id)).catch(()=>{});if(k=='fr'&&fv==id)fv=null;if(k=='fu'&&pf==id)pf=null;if(k=='diag'&&dv==id)dv=null;fechar();toast('Excluído.')}catch(e){fechar();toast('Sem permissão para excluir.')}}

/* Supervisão */
function verAc(id){const r=S.ac.find(x=>x.id==id);if(!r)return;
 const L2=(l,v)=>v?`<div class="dl"><small>${l}</small><div>${esc(v).replace(/\n/g,'<br>')}</div></div>`:'';
 const podeRev=SUP()&&String(r.registradoPapel||'').toLowerCase()!='supervisora';
 $('#md').innerHTML=`<div role="dialog" aria-modal="true"><h2>${esc(r.tipo||'Acompanhamento')} — ${quem(r,false)}</h2>
 <div class="sub">${fd(r.data)} · registrado por ${esc(r.registradoNome||'—')} em ${fdh(r.registradoEm)}${r.editadoEm?` · editado por ${esc(r.editadoNome||'—')} em ${fdh(r.editadoEm)}`:''}</div>
 ${L2('Modalidade',r.modalidade)}${L2('Franquia',r.fr&&nm('fr',r.fr))}${(r.participantes||[]).length?`<div class="dl"><small>Participantes</small><div>${r.participantes.map(x=>esc(nm('fu',x))).join(', ')}</div></div>`:''}${L2('Motivo',r.motivo)}${L2('Responsável',r.resp)}${L2('Relato',r.relato)}${L2('Orientações / encaminhamentos',r.orient)}${L2('Próximo acompanhamento',r.prox&&fd(r.prox))}
 <div class="note"><b>Supervisão:</b> ${supTag(r)}${r.supEm?`<br><small>${esc(r.supNome||'')} · ${fdh(r.supEm)}</small>`:''}${r.supObs?`<div style="margin-top:6px">${esc(r.supObs).replace(/\n/g,'<br>')}</div>`:''}</div>
 ${podeRev?`<form id="rf"><label for="r_st">Resultado da revisão</label><select id="r_st"><option ${r.supStatus=='Revisado'?'selected':''}>Revisado</option><option ${r.supStatus=='Revisado com observações'?'selected':''}>Revisado com observações</option></select>
 <label for="r_obs">Observações da supervisão</label><textarea id="r_obs" rows="4">${esc(r.supObs||'')}</textarea><div id="rerr" class="err" hidden></div>
 <div style="display:flex;gap:8px"><button class="btn s" type="submit" id="rbtn">Salvar revisão</button><button class="btn g" type="button" data-a="cl">Fechar</button></div></form>`:`<button class="btn g" data-a="cl">Fechar</button>`}</div>`;
 $('#md').hidden=false;const rf=$('#rf');rf&&rf.addEventListener('submit',ev=>{ev.preventDefault();salvarRev(id)})}
async function salvarRev(id){const r=S.ac.find(x=>x.id==id),b=$('#rbtn');b.disabled=true;b.textContent='Salvando…';
 const o={...r,supStatus:$('#r_st').value,supObs:$('#r_obs').value.trim(),supPor:MYID,supNome:MYNOME||MYEMAIL,supEm:agora()};delete o.id;
 try{await setDoc(doc(db,'ac',id),o);fechar();toast('Revisão registrada.')}catch(e){b.disabled=false;b.textContent='Salvar revisão';const er=$('#rerr');er.textContent='Não foi possível salvar a revisão ('+(e.code||'erro')+').';er.hidden=false}}

/* ---------- Ações de clique ---------- */
const ACT={
 go:v=>{cur=v;q='';pf=fv=dv=null;render();scrollTo(0,0)},
 frp:id=>{fv=id;pf=dv=null;render();scrollTo(0,0)},
 prof:id=>{pf=id;fechar();render();scrollTo(0,0)},
 dgp:id=>{dv=id;pf=null;render();scrollTo(0,0)},
 back:()=>{if(pf)pf=null;else if(dv)dv=null;else fv=null;render()},
 novo:(k,pre)=>{const o={};if(pre){const[a,b]=pre.split(':');o[a]=b}abrirForm(k,'',o)},
 edit:(k,id)=>abrirForm(k,id),
 del:(k,id)=>pedirExclusao(k,id),delok:(k,id)=>excluir(k,id),
 verAc:id=>verAc(id),verAcao:id=>verAcao(id),impDiag:()=>impDiag(),editDiag:id=>editDiag(id),
 impCand:()=>impCand(),verCand:id=>verCand(id),contratar:id=>contratar(id),
 delCand:id=>confirmar('Excluir candidato?','Os dados pessoais desta pessoa serão apagados do sistema. Não dá para desfazer.','delok','cand',id),
 cl:()=>fechar(),sair:()=>signOut(auth),reset:()=>esqueci(),
 saveAcc:async id=>{const el=document.querySelector(`.pr[data-id="${CSS.escape(id)}"]`),a=lerAcc(el);try{await setDoc(doc(db,'acessos',id),{...ACC[id],...a});toast('Acesso atualizado.')}catch(e){toast('Não foi possível salvar.')}},
 resetP:async id=>{try{await sendPasswordResetEmail(auth,ACC[id].email);toast('Link para nova senha enviado para '+ACC[id].email+'.')}catch(e){toast('Não foi possível enviar o e-mail.')}},
 rmAcc:id=>confirmar('Remover acesso?',`${esc(ACC[id].nome||ACC[id].email)} não verá mais nada no sistema. O login continua existindo, mas sem acesso.`,'rmOk',id),
 rmOk:async id=>{try{await deleteDoc(doc(db,'acessos',id));fechar();toast('Acesso removido.');render()}catch(e){fechar();toast('Não foi possível remover.')}}
};
document.addEventListener('click',e=>{if(e.target.id=='md'){fechar();return}const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const f=ACT[t.dataset.a];f&&f(t.dataset.x,t.dataset.y)});
document.addEventListener('submit',e=>{if(e.target.id=='nf'){e.preventDefault();criarLogin()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#md').hidden)fechar()});
document.addEventListener('change',e=>{if(e.target.id=='ft'){fTipo=e.target.value;render()}if(e.target.id=='fe'){fEtapa=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id!='q')return;q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');if(i){i.focus();i.setSelectionRange(p,p)}});
</script>





</body></html>
